services:

  postgres:
    image: postgres:16-alpine
    container_name: asterion-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: asterion_auth
      POSTGRES_USER: asterion
      POSTGRES_PASSWORD: asterion

    ports:
      - "55433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterion -d asterion_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: asterion-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
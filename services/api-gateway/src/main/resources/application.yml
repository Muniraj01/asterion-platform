spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true

          routes:
            - id: auth-service
              uri: ${ASTERION_AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    key-resolver: "#{@rateLimitKeyResolver}"

                - name: Retry
                  args:
                    retries: 2
                    series: SERVER_ERROR
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 200ms
                      factor: 2
                      basedOnPreviousValue: false

                - name: CircuitBreaker
                  args:
                    name: authServiceCircuitBreaker
                    fallbackUri: forward:/fallback/auth-service

              metadata:
                response-timeout: 2000

            - id: auth-admin-service
              uri: ${ASTERION_AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/**
              metadata:
                response-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      authServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true

server:
  port: 8080

management:
  observations:
    enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true

asterion:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    internal:
      service-name: ${ASTERION_SERVICE_NAME:api-gateway}
      service-token: ${ASTERION_SERVICE_TOKEN:change-me-internal-service-token}
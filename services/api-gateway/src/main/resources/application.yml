spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: ${ASTERION_AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**

            - id: auth-admin-service
              uri: ${ASTERION_AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/admin/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

asterion:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
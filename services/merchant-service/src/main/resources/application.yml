spring:
  application:
    name: merchant-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      properties:
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8082}

asterion:
  security:
    internal:
      gateway:
        service-name: ${ASTERION_GATEWAY_SERVICE_NAME:api-gateway}
        service-token: ${ASTERION_GATEWAY_SERVICE_TOKEN:change-me-internal-service-token}

      order:
        service-name: ${ASTERION_ORDER_SERVICE_NAME:order-service}
        service-token: ${ASTERION_ORDER_SERVICE_TOKEN:change-me-order-service-token}

  merchant:
    kafka:
      topic: ${ASTERION_MERCHANT_KAFKA_TOPIC:merchant.events}

    outbox:
      poll-interval-ms: ${ASTERION_MERCHANT_OUTBOX_POLL_INTERVAL_MS:1000}
      batch-size: ${ASTERION_MERCHANT_OUTBOX_BATCH_SIZE:100}
      claim-lease-seconds: ${ASTERION_MERCHANT_OUTBOX_CLAIM_LEASE_SECONDS:60}